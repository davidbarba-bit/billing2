services:
  postgres:
    image: postgres:16-alpine
    container_name: minilago-postgres
    environment:
      POSTGRES_USER: minilago
      POSTGRES_PASSWORD: minilago
      POSTGRES_DB: minilago
    ports:
      - "5432:5432"
    volumes:
      - minilago-pg-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U minilago -d minilago"]
      interval: 2s
      timeout: 2s
      retries: 20

volumes:
  minilago-pg-data:
