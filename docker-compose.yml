services:
  postgres:
    image: postgres:16-alpine
    container_name: numaris-billing-postgres
    environment:
      POSTGRES_USER: numaris
      POSTGRES_PASSWORD: numaris
      POSTGRES_DB: numaris_billing
    ports:
      - "5432:5432"
    volumes:
      - numaris-billing-pg-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U numaris -d numaris_billing"]
      interval: 2s
      timeout: 2s
      retries: 20

volumes:
  numaris-billing-pg-data:
