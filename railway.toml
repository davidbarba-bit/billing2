# Railway configuration. The Dockerfile in the repo root handles build +
# install + Prisma generate; Railway picks DOCKERFILE automatically when
# one is present, but pin it here so the choice is explicit.

[build]
builder = "DOCKERFILE"

[deploy]
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 5
healthcheckPath = "/health"
healthcheckTimeout = 30
